<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- testing to see if it works :p -->
    <div class=""></div>

    <!-- header -->
    <div></div>
    <div>
      <!-- your library section -->
      <section class="library"></section>

      <!-- our playlist section! -->

      <section class="playlist">
        <div class="playlist-header">
          <div class="playlist-pic"></div>

          <div class="playlist-info">
            <p>Private playlist</p>
            <h1>Favorite Songs</h1>

            <div class="playlist-creator">
              <p>Sam</p>
            </div>
          </div>
        </div>

        <div class="playlist-container">
          <div class="song-header">
            <span>#</span>
            <span>Title</span>
            <span>Album</span>
            <span>Duration</span>
          </div>

          <!-- <div class="song">
            <span class="song-num">1</span>
            <div class="song-left">
              <div class="img"></div>
              <div>
                <p class="song-title">Song Name</p>
                <p class="song-artist">Artist</p>
              </div>
            </div>
            <span class="song-album">Album Name</span>
            <span class="song-duration">3:24</span>
          </div> -->
        </div>
      </section>
    </div>
    <script>
      async function loadPlaylist() {
        const response = await fetch("http://localhost:8000/playlist");
        const data = await response.json();

        const container = document.querySelector(".playlist-container");

        data.songs.forEach((song, index) => {
          const songDiv = document.createElement("div");
          songDiv.classList.add("song");

          songDiv.innerHTML = `
        <span class="song-num">${index + 1}</span>
        <div class="song-left">
          <div class="img"></div>
          <div>
            <p class="song-title">${song.title}</p>
            <p class="song-artist">${song.artist}</p>
          </div>
        </div>
        <span class="song-album">${song.album}</span>
        <span class="song-duration">${song.duration}</span>
      `;

          container.appendChild(songDiv);
        });
      }

      loadPlaylist();
    </script>
  </body>
</html>
